<svg xmlns='http://www.w3.org/2000/svg' width='1700' height='900' viewBox='0 0 1700 900'><rect width='100%' height='100%' fill='white'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#3a3a3a'/></marker><marker id='t' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#0b7f6a'/></marker><marker id='o' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d98a00'/></marker><marker id='g' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a9494'/></marker></defs><text x='850' y='36.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='17' fill='#0b7f6a' text-anchor='middle' font-weight="bold">Modelo del almacenamiento actual — no existe base de datos ni persistencia de negocio</text><rect x='30' y='60' width='560' height='520' rx='16' fill='#fbfdfc' stroke='#0b7f6a' stroke-width='2' stroke-dasharray='8 6'/><text x='310' y='90.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#0b7f6a' text-anchor='middle' font-weight="bold">1) Navegador — localStorage (lib/history.ts)</text><rect x='60' y='110' width='500' height='140' rx='6' fill='#f4f6f5' stroke='#0b7f6a' stroke-width='2'/><text x='310.0' y='127.8' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='11' fill='#666' text-anchor='middle' font-style="italic">«tipo TypeScript»</text><text x='310.0' y='148.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#0b7f6a' text-anchor='middle' font-weight="bold">HistoryEntry</text><line x1='60' y1='156' x2='560' y2='156' stroke='#0b7f6a' stroke-width='1'/><text x='72' y='180.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>id: string</text><text x='72' y='201.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>personaId: string        (id de lista cerrada, 7 posibles)</text><text x='72' y='222.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>startedAt: number       (epoch ms)</text><text x='72' y='243.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>messages: HistoryMessage[]</text><rect x='60' y='300' width='500' height='140' rx='6' fill='#f4f6f5' stroke='#0b7f6a' stroke-width='2'/><text x='310.0' y='317.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='11' fill='#666' text-anchor='middle' font-style="italic">«tipo TypeScript»</text><text x='310.0' y='338.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#0b7f6a' text-anchor='middle' font-weight="bold">HistoryMessage</text><line x1='60' y1='346' x2='560' y2='346' stroke='#0b7f6a' stroke-width='1'/><text x='72' y='370.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>id: string</text><text x='72' y='391.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>role: 'user' | 'agent'</text><text x='72' y='412.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>text: string                (máx. 2.000 caracteres)</text><text x='72' y='433.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>timestamp: number</text><line x1='310' y1='250' x2='310' y2='300' stroke='#0b7f6a' stroke-width='2' marker-end='url(#t)'/><text x='330' y='280.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#0b7f6a' text-anchor='start'>1 → 0..400</text><rect x='60' y='460' width='500' height='96' rx='12' fill='#fffdf5' stroke='#d98a00' stroke-width='2'/><text x='310.0' y='496.6' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>Clave: alloxentric-demo-history-v1</text><text x='310.0' y='512.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>Límites: 30 conversaciones · 400 mensajes · 2.000 caracteres por mensaje</text><text x='310.0' y='527.8' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>Lecturas y escrituras defensivas; nunca se envía a un servidor</text><rect x='620' y='60' width='520' height='520' rx='16' fill='#fbfdfc' stroke='#555' stroke-width='2' stroke-dasharray='8 6'/><text x='880' y='90.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#555' text-anchor='middle' font-weight="bold">2) Navegador — cookie de sesión (lib/server/session.ts)</text><rect x='650' y='110' width='460' height='140' rx='6' fill='#f4f6f5' stroke='#0b7f6a' stroke-width='2'/><text x='880.0' y='127.8' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='11' fill='#666' text-anchor='middle' font-style="italic">«cookie»</text><text x='880.0' y='148.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#0b7f6a' text-anchor='middle' font-weight="bold">Cookie __Host-alloxentric-demo</text><line x1='650' y1='156' x2='1110' y2='156' stroke='#0b7f6a' stroke-width='1'/><text x='662' y='180.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>valor: JWT firmado con DEMO_SESSION_SIGNING_SECRET</text><text x='662' y='201.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>vigencia: DEMO_SESSION_TTL_SECONDS (1.800 s por defecto)</text><text x='662' y='222.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>atributos: Path=/ · HttpOnly · Secure · SameSite=Strict</text><text x='662' y='243.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>no almacena identidad de la persona: el código es compartido</text><rect x='650' y='330' width='460' height='110' rx='12' fill='#f4f6f5' stroke='#c9d0d0' stroke-width='2'/><text x='880.0' y='381.4' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>Ningún dato personal ni conversación viaja en la cookie.</text><text x='880.0' y='397.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>El código de acceso se compara con SHA-256 en tiempo constante.</text><rect x='1170' y='60' width='500' height='520' rx='16' fill='#fbfdfc' stroke='#555' stroke-width='2' stroke-dasharray='8 6'/><text x='1420' y='90.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#555' text-anchor='middle' font-weight="bold">3) Worker — logs de métricas (metrics.py)</text><rect x='1200' y='110' width='440' height='140' rx='6' fill='#f4f6f5' stroke='#0b7f6a' stroke-width='2'/><text x='1420.0' y='127.8' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='11' fill='#666' text-anchor='middle' font-style="italic">«registro»</text><text x='1420.0' y='148.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#0b7f6a' text-anchor='middle' font-weight="bold">Línea de log JSON (por turno)</text><line x1='1200' y1='156' x2='1640' y2='156' stroke='#0b7f6a' stroke-width='1'/><text x='1212' y='180.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>campos numéricos con sufijo _s (segundos):</text><text x='1212' y='201.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>transcription_delay · end_of_turn_delay</text><text x='1212' y='222.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>llm_node_ttft · tts_node_ttfb</text><text x='1212' y='243.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>playback_latency · e2e_latency</text><rect x='1200' y='300' width='440' height='140' rx='6' fill='#f4f6f5' stroke='#0b7f6a' stroke-width='2'/><text x='1420.0' y='317.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='11' fill='#666' text-anchor='middle' font-style="italic">«registro»</text><text x='1420.0' y='338.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#0b7f6a' text-anchor='middle' font-weight="bold">Línea de log JSON (por sesión)</text><line x1='1200' y1='346' x2='1640' y2='346' stroke='#0b7f6a' stroke-width='1'/><text x='1212' y='370.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>uso acumulado: tokens, caracteres, segundos</text><text x='1212' y='391.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>contadores de errores y cierre</text><text x='1212' y='412.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>sin texto de conversación, audio, credenciales,</text><text x='1212' y='433.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='start'>ni nombres de sala o participantes</text><rect x='1200' y='480' width='440' height='70' rx='12' fill='#fffdf5' stroke='#d98a00' stroke-width='2'/><text x='1420.0' y='511.4' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>Se escriben al logger local; no hay archivo ni envío</text><text x='1420.0' y='527.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#3a3a3a' text-anchor='middle'>externo por defecto. E01 es un extracto archivado.</text><rect x='30' y='620' width='1640' height='220' rx='16' fill='#fffaf0' stroke='#d98a00' stroke-width='2' stroke-dasharray='8 6'/><text x='850' y='650.9' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='14' fill='#d98a00' text-anchor='middle' font-weight="bold">AUSENTE EN LA IMPLEMENTACIÓN — no se documentan tablas, relaciones ni claves porque no existen</text><rect x='60' y='690' width='290' height='70' rx='12' fill='#fff4e0' stroke='#d98a00' stroke-width='2' stroke-dasharray='6 4'/><text x='205.0' y='729.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>Base de datos (SQL / NoSQL)</text><rect x='382' y='690' width='290' height='70' rx='12' fill='#fff4e0' stroke='#d98a00' stroke-width='2' stroke-dasharray='6 4'/><text x='527.0' y='721.4' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>Entidades de negocio: deudor,</text><text x='527.0' y='737.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>cartera, deuda, campaña</text><rect x='704' y='690' width='290' height='70' rx='12' fill='#fff4e0' stroke='#d98a00' stroke-width='2' stroke-dasharray='6 4'/><text x='849.0' y='721.4' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>Registro de llamadas o</text><text x='849.0' y='737.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>resultados de cobranza</text><rect x='1026' y='690' width='290' height='70' rx='12' fill='#fff4e0' stroke='#d98a00' stroke-width='2' stroke-dasharray='6 4'/><text x='1171.0' y='721.4' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>Almacenamiento de audio</text><text x='1171.0' y='737.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>o de transcripciones en servidor</text><rect x='1348' y='690' width='290' height='70' rx='12' fill='#fff4e0' stroke='#d98a00' stroke-width='2' stroke-dasharray='6 4'/><text x='1493.0' y='721.4' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>Identidad individual de</text><text x='1493.0' y='737.0' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#7a4a00' text-anchor='middle'>evaluadores (código compartido)</text><text x='850' y='814.2' font-family='Segoe UI, DejaVu Sans, Arial, sans-serif' font-size='12' fill='#555' text-anchor='middle' font-style="italic">Los "datos" de los escenarios de cobranza (monto, deudor) son texto fijo dentro de las instrucciones de cada Persona; son ficticios y no se consultan en una base.</text></svg>